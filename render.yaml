services:
  - type: web
    name: warehouse-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
